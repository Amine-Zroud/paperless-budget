# Local customisations – copy to docker-compose.override.yml (ignored by Git).
# Docker Compose reads this file automatically in addition to docker-compose.yml.
# Example: join Paperless's Docker network (check the name with `docker network ls`).
services:
  paperless-budget:
    networks:
      - paperless

networks:
  paperless:
    external: true
    name: paperless_default
