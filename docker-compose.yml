services:
  paperless-budget:
    build: .
    container_name: paperless-budget
    restart: unless-stopped
    ports:
      - "8088:8000"
    env_file: .env
    volumes:
      - ./data:/data
    # If Paperless runs on the same Docker host: join the Paperless network
    # and set PAPERLESS_URL to the container name (e.g. http://paperless-webserver:8000).
    # networks:
    #   - paperless

# networks:
#   paperless:
#     external: true
#     name: paperless_default
